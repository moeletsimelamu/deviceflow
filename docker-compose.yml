# DeviceFlow local stack.
#
#   docker compose up -d db              # database only (for `npm run dev`)
#   docker compose up -d --build         # full stack: db → migrate → api → web
#   docker compose --profile demo run --rm seed   # load demo data into the stack
#
# Values come from `.env` (copy `.env.example`). Everything here is for local
# development and demos; production configuration lives in DEPLOYMENT.md.

name: deviceflow

x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: deviceflow-api:local

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      # Bound to localhost only: the database is never exposed on the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations, then exits. The API starts only after it succeeds.
  migrate:
    <<: *api-image
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      <<: *api-env
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: http://localhost:8080
      # The demo stack is served on http://localhost, which browsers treat as a
      # secure context, so Secure cookies work. Real deployments must use HTTPS.
      COOKIE_SECURE: 'true'
      TRUST_PROXY: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: deviceflow-web:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy

  # Demo data. Never part of a production deployment.
  seed:
    <<: *api-image
    profiles: ['demo']
    command: ['node', 'dist/prisma/seed.js']
    environment:
      <<: *api-env
      NODE_ENV: production
      COOKIE_SECURE: 'true'
      DEMO_SEED_CONFIRM: 'this-is-not-production'
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:?set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
