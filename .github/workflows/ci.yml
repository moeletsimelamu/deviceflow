name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deviceflow
          # CI-only credential for a throwaway service container.
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: deviceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deviceflow -d deviceflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL only has to be valid for config loading; tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://deviceflow:ci_only_password@localhost:5432/deviceflow
      TEST_DATABASE_URL: postgresql://deviceflow:ci_only_password@localhost:5432/deviceflow_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the project's npm version
        run: npm install -g npm@11.21.1

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Container images and end-to-end tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the project's npm version
        run: npm install -g npm@11.21.1

      - run: npm ci

      - name: Prepare the environment file
        # The demo password is made fresh for this run; it is never stored.
        run: |
          cp .env.example .env
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sed -i "s|^SEED_DEFAULT_PASSWORD=.*|SEED_DEFAULT_PASSWORD=$password|" .env
          echo "SEED_DEFAULT_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build and start the stack (production images behind nginx)
        run: |
          docker compose -p deviceflow-e2e -f docker-compose.yml -f docker/compose.e2e.yml up -d --build --wait
          docker compose -p deviceflow-e2e -f docker-compose.yml -f docker/compose.e2e.yml --profile demo run --rm seed

      - name: Install Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: docker compose -p deviceflow-e2e -f docker-compose.yml -f docker/compose.e2e.yml logs --no-color api web
