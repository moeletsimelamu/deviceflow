# Serves the SPA and reverse-proxies the API on the same origin, so the browser
# never makes cross-origin requests and no CORS configuration is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # Note: add_header in a location replaces server-level headers, so every
    # location includes the shared security headers explicitly.

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        # The API (helmet) sets some of the same headers. Drop its copies so each
        # header is sent once, with nginx's value; two different X-Frame-Options
        # values would make browsers ignore the header.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # Hashed build files never change: cache them for a year. The folder is
    # /static/ (vite.config.ts), not Vite's default /assets/, which is also the
    # app's address for device pages (/assets/<id>).
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html and the client router handles them.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
